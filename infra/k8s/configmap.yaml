# Non-secret backend configuration.
# Secrets (DB password, JWT secret, API keys) live in secret.yaml.template.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: extraction
data:
  NODE_ENV: "production"
  LOG_LEVEL: "warn"
  PORT: "3001"
  DATABASE_POOL_MIN: "2"
  DATABASE_POOL_MAX: "20"
  REDIS_TLS: "true"
  JWT_EXPIRES_IN: "7d"
  JWT_REFRESH_EXPIRES_IN: "30d"
  BCRYPT_ROUNDS: "12"
  OLLAMA_BASE_URL: "http://ollama.extraction.svc.cluster.local:11434"
  OLLAMA_MODEL: "llama3.1:8b"
  ELEVENLABS_MODEL_ID: "eleven_turbo_v2_5"
  S3_REGION: "us-east-1"
  S3_BUCKET: "extraction-prod"
