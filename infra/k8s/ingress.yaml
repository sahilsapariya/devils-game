# Ingress with TLS termination via cert-manager.
# Requires:
#   - ingress-nginx (or another controller) installed in the cluster
#   - cert-manager with a ClusterIssuer named `letsencrypt-prod`
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend
  namespace: extraction
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.extraction.example.com   # replace with real host
      secretName: backend-tls
  rules:
    - host: api.extraction.example.com  # replace with real host
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3001
