name: Deploy

# Placeholder deploy workflow.
# Triggers only on pushes to main and requires manual approval through the
# `production` environment (configure in Settings → Environments).
# Actual deploy targets (k8s cluster, registry, etc.) are TBD — see Phase 8.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Backend Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # TODO: configure registry login (GHCR / ECR / GAR) once target chosen.
      # - name: Log in to GHCR
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: false
          tags: |
            extraction-backend:${{ github.sha }}
            extraction-backend:latest

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: staging
    steps:
      - run: echo "TODO - apply k8s manifests to staging cluster"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment:
      name: production  # gated by required reviewers in repo settings
    steps:
      - run: echo "TODO - rolling deploy 10% -> 50% -> 100% per spec"
