name: Deploy to VPS

# SSH-based deploy to a single-VPS production target.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   VPS_HOST     — IP address or hostname of the VPS
#   VPS_USER     — SSH user (typically `root` or `deploy`)
#   VPS_SSH_KEY  — private SSH key with access to VPS_USER@VPS_HOST
#   DOMAIN       — public domain Caddy is serving (e.g. extraction.example.com)
#
# Optional:
#   VPS_PORT     — SSH port (defaults to 22)
#   VPS_APP_DIR  — checkout location on the VPS (defaults to /opt/extraction/app)
#
# Manual approval is enforced via the `production` GitHub Environment — add
# required reviewers there before this workflow can run.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH deploy to VPS
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ secrets.DOMAIN }}
    steps:
      - name: Pull and rebuild stack on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.VPS_APP_DIR || '/opt/extraction/app' }}"
            cd "${APP_DIR}"
            echo "==> Pulling latest from origin/main"
            git fetch --prune origin
            git reset --hard origin/main
            echo "==> Building & restarting compose stack"
            docker compose -f docker-compose.prod.yml pull --ignore-buildable || true
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
            echo "==> Cleaning dangling images"
            docker image prune -f

      - name: Health check
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          set -euo pipefail
          if [[ -z "${DOMAIN}" ]]; then
            echo "::error::DOMAIN secret is not configured"
            exit 1
          fi
          echo "Polling https://${DOMAIN}/health"
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 "https://${DOMAIN}/health" >/dev/null; then
              echo "✓ /health is OK (attempt ${i})"
              exit 0
            fi
            echo "  attempt ${i}: not yet, sleeping 5s"
            sleep 5
          done
          echo "::error::/health did not come up within 60 seconds"
          exit 1
