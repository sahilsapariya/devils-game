# PROJECT EXTRACTION - Local Development Stack
#
# Backend now uses SQLite (operational.db + telemetry.db on disk under
# `packages/backend/data/`) and an in-process event bus, so no PostgreSQL or
# Redis containers are required for local development. The default
# `docker compose up` brings up nothing — backend, mobile, desktop-agent, and
# browser-extension packages are run on the host via `npm run dev` (turbo).
#
# The only service defined here is the optional local LLM runtime (Ollama),
# which is opt-in via the `ai` profile:
#
#   docker compose --profile ai up -d ollama   # start Ollama
#   docker compose --profile ai down            # stop Ollama
#
# In production, the backend can be configured to call a hosted model instead.

services:
  # Ollama — optional local LLM runtime for offline announcement generation.
  # Enable via:  docker compose --profile ai up -d
  ollama:
    image: ollama/ollama:latest
    container_name: extraction-ollama
    restart: unless-stopped
    profiles: ["ai"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
    driver: local
